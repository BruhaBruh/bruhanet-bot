name: bruhanet

services:
  redis:
    image: redis:8.10
    healthcheck:
      test: [CMD-SHELL, redis-cli ping]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 127.0.0.1:6379:6379

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bruhanet
      POSTGRES_PASSWORD: bruhanet
      POSTGRES_DB: bruhanet
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bruhanet]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 127.0.0.1:5432:5432
