apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-alerts
    receivers:
      - uid: telegram-alerts
        type: telegram
        settings:
          bottoken: $ALERT_TELEGRAM_TOKEN
          chatid: ${ALERT_TELEGRAM_CHAT_ID}
          parse_mode: MarkdownV2
          message: '{{ template "bruhanet.message" . }}'
  # Паника — одно сообщение, без «прошёл».
  - orgId: 1
    name: telegram-panics
    receivers:
      - uid: telegram-panics
        type: telegram
        disableResolveMessage: true
        settings:
          bottoken: $ALERT_TELEGRAM_TOKEN
          chatid: ${ALERT_TELEGRAM_CHAT_ID}
          parse_mode: MarkdownV2
          message: '{{ template "bruhanet.message" . }}'
