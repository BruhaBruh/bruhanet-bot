# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: ['.env']

vars:
  MODULE_PREFIX: github.com/bruhabruh/bruhanet
  COMPOSE: docker compose -f docker-compose.yaml

  SERVICES: bot api
  MODULES: pkg core {{range (splitList " " .SERVICES)}}{{.}} {{end}}

  GOLANGCI_LINT_VERSION: v2.15.0

includes:
  setup:
    taskfile: ./taskfiles/setup.yaml
    flatten: true
  workspace:
    taskfile: ./taskfiles/workspace.yaml
    flatten: true
  ci:
    taskfile: ./taskfiles/ci.yaml
    flatten: true
  development:
    taskfile: ./taskfiles/development.yaml
    flatten: true
  docker:
    taskfile: ./taskfiles/docker.yaml
    flatten: true
  deploy:
    taskfile: ./taskfiles/deploy.yaml
    flatten: true

tasks:
  default:
    desc: Показать список задач
    silent: true
    cmds:
      - task --list

  web:install:
    desc: Установить зависимости фронта
    cmds:
      - pnpm -C web install

  web:dev:
    desc: Vite dev-сервер админки (proxy на api :8090)
    cmds:
      - pnpm -C web/admin dev

  web:build:
    desc: Собрать фронт в web/admin/dist
    cmds:
      - pnpm -C web build

  web:test:
    desc: Тесты и typecheck фронта
    cmds:
      - pnpm -C web test
      - pnpm -C web typecheck

  web:lint:
    desc: Линтер фронта
    cmds:
      - pnpm -C web lint
