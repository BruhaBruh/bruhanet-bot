root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd"
  entrypoint = "./tmp/main"
  include_ext = ["go", "yaml", "toml"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  main_only = true
  time = true

[misc]
  startup_banner = ""
